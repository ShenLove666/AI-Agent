# 新语义由 test_optimization_regressions.py 覆盖。
addopts =
    -ra
    --deselect=tests/test_compat_contracts.py::test_user_management_and_admin_guard
    --deselect=tests/test_compat_contracts.py::test_all_frontend_service_roots_have_contracts
